<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APM Change Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css">
  <style>
    .app-shell { min-height: 100vh; }
    .nav-button { border: 0; color: var(--muted); background: transparent; cursor: pointer; font-weight: 700; }
    .nav-button:hover { color: var(--green); }
    .notice { margin: 0 0 20px; padding: 12px 14px; border: 1px solid #a8d8bf; background: #eaf7f0; color: var(--green-dark); border-radius: 4px; }
    .notice.error { border-color: #e9b9b5; background: #fff0ef; color: #762626; }
    .form-card { max-width: 700px; margin: 0 auto; padding: 28px; background: white; border: 1px solid var(--line); border-radius: var(--radius); }
    .form-card .form-stack { margin-top: 0; }
    .inline-form { display: flex; gap: 10px; align-items: end; }
    .inline-form label { flex: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="static/app.js"></script>
</body>
</html>
