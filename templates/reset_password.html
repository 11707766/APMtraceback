{% extends "auth_base.html" %}
{% block title %}Choose password · APM Change Control{% endblock %}
{% block auth_content %}
<p class="eyebrow">Account recovery</p>
<h2>Choose a new password</h2>
<p class="muted">Use at least eight characters.</p>
<form method="post" class="form-stack">
  <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
  <label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus></label>
  <button class="button primary wide" type="submit">Update password <span>→</span></button>
</form>
{% endblock %}
