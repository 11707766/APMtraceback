{% extends "base.html" %}
{% block title %}Reset user password · APM Change Control{% endblock %}
{% block content %}
<main class="page narrow">
  <a class="back" href="{{ url_for('dashboard') }}">← Back to dashboard</a>
  <section class="detail-main account-form">
    <div>
      <p class="eyebrow">Administrator</p>
      <h1>Set a temporary password</h1>
      <p class="muted">The user can sign in with this password and change it from their dashboard.</p>
    </div>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
      <label>User work email<input type="email" name="email" value="{{ email }}" autocomplete="email" required autofocus placeholder="name@company.com"></label>
      <label>Temporary password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <button class="button primary" type="submit">Set temporary password</button>
    </form>
  </section>
</main>
{% endblock %}
