{% extends "auth_base.html" %}
{% block title %}Administrator sign in · APM Change Control{% endblock %}
{% block auth_content %}
<p class="eyebrow">Administrator access</p>
<h2>Sign in as administrator</h2>
<p class="muted">Use the administrator work email and password.</p>
<form method="post" class="form-stack">
  <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
  <label>Administrator email<input type="email" name="email" autocomplete="email" required autofocus placeholder="name@company.com"></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required placeholder="Enter your password"></label>
  <button class="button primary wide" type="submit">Sign in as administrator <span>→</span></button>
</form>
<p class="auth-switch"><a href="{{ url_for('login') }}">← Back to sign in</a></p>
{% endblock %}
