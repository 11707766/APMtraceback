{% extends "auth_base.html" %}
{% block title %}Sign in · APM Change Control{% endblock %}
{% block auth_content %}
<p class="eyebrow">Welcome back</p>
<h2>Sign in to APM Change Control</h2>
<p class="muted">Use your registered project credentials.</p>
<form method="post" class="form-stack">
  <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
  <label>Email address<input type="email" name="email" autocomplete="email" required autofocus placeholder="name@company.com"></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required placeholder="Enter your password"></label>
  <div class="form-row between"><label class="check"><input type="checkbox" name="remember"> Remember me</label></div>
  <button class="button primary wide" type="submit">Sign in <span>→</span></button>
</form>
<p class="auth-switch">New to APM Change Control? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
