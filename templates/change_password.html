{% extends "base.html" %}
{% block title %}Change password · APM Change Control{% endblock %}
{% block content %}
<main class="page narrow">
  <a class="back" href="{{ url_for('dashboard') }}">← Back to dashboard</a>
  <section class="detail-main account-form">
    <div>
      <p class="eyebrow">Account security</p>
      <h1>Set a new password</h1>
      <p class="muted">Your new password must contain at least eight characters.</p>
    </div>
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
      <label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus></label>
      <button class="button primary" type="submit">Update password</button>
    </form>
  </section>
</main>
{% endblock %}
