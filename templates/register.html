{% extends "auth_base.html" %}
{% block title %}Create account · APM Change Control{% endblock %}
{% block auth_content %}
<p class="eyebrow">New account</p><h2>Join the project</h2><p class="muted">Choose the role that matches your work.</p>
<form method="post" class="form-stack">
  <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
  <label>Full name<input name="name" autocomplete="name" required placeholder="Your full name"></label>
  <label>Work email<input type="email" name="email" autocomplete="email" required placeholder="name@company.com"></label>
  <label>Role<select name="role" required><option value="">Select role</option><option value="developer">Developer</option><option value="tester">Tester</option></select></label>
  <label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label>
  <button class="button primary wide" type="submit">Create account <span>→</span></button>
</form>
<p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
