{% extends "auth_base.html" %}
{% block title %}Reset password · APM Change Control{% endblock %}
{% block auth_content %}
<p class="eyebrow">Account recovery</p><h2>Reset your password</h2><p class="muted">Enter your work email and we’ll send a secure one-hour reset link.</p>
<form method="post" class="form-stack">
  <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
  <label>Work email<input type="email" name="email" autocomplete="email" required autofocus placeholder="name@company.com"></label>
  <button class="button primary wide" type="submit">Send reset link <span>→</span></button>
</form>
<p class="auth-switch"><a href="{{ url_for('login') }}">← Back to sign in</a></p>
{% endblock %}
